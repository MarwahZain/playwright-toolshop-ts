# Fast gate on every push to main and every pull request:
# static checks first, then the @smoke set against the public demo site.
# The full suite runs in regression.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI has no local Toolshop, so the smoke set runs on the public uat environment
# (URLs in src/config/environments.ts).
env:
  TEST_ENV: uat

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Every test tagged @regression
        run: npm run check:tags

  # No `environment:` here on purpose: the uat environment requires approval, and a PR
  # check must not wait for a click. The account comes from repository secrets instead.
  smoke:
    name: smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      CUSTOMER_NAME: ${{ vars.CUSTOMER_NAME }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      # Shows which account settings reached the job, never their values: whether each is
      # set, its length, stray whitespace, and whether an email has the expected domain.
      - name: Check account settings (values hidden)
        run: |
          for name in CUSTOMER_EMAIL CUSTOMER_PASSWORD ADMIN_EMAIL ADMIN_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then echo "$name: not set, falls back to test-data/login.json"; continue; fi
            line="$name: set, ${#value} characters"
            [[ "$value" =~ ^[[:space:]] || "$value" =~ [[:space:]]$ ]] && line="$line, WARNING: leading or trailing whitespace"
            if [[ "$name" == *_EMAIL ]]; then
              [[ "$value" == *@practicesoftwaretesting.com ]] && line="$line, domain ok" || line="$line, WARNING: unexpected domain"
            fi
            echo "$line"
          done
          echo "CUSTOMER_NAME: ${CUSTOMER_NAME:-not set}"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (guest, customer, admin)
        run: npm run test:smoke
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14
