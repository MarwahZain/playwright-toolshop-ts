# Weekly pull requests that keep dependencies current. Each PR runs the CI gate like any other.
version: 2
updates:
  # Actions used by the workflows (checkout, setup-node, upload-artifact, ...), in one PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  # npm packages: minor and patch updates grouped in one PR, majors separately.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Upgraded by hand together with the Playwright Docker image in the visual scripts
      # (mcr.microsoft.com/playwright:vX.Y.Z-noble); the versions must match.
      - dependency-name: '@playwright/test'
